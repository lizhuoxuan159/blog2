<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员用户管理</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <nav>
    <a href="/index.html"><button class="glass-btn">返回首页</button></a>
  </nav>
  <div class="glass" style="margin-bottom:20px">
    <h3>手动创建新用户</h3>
    <input type="text" id="newUser" placeholder="用户名">
    <input type="password" id="newPwd" placeholder="初始密码">
    <!-- 管理员创建用户 移除owner选项 -->
    <select id="newRole">
      <option value="guest">访客 guest</option>
      <option value="writer">作家 writer</option>
      <option value="admin">管理员 admin</option>
      <option value="banned">封禁 banned</option>
    </select>
    <button class="glass-btn" onclick="adminCreateUser()">创建用户</button>
  </div>
  <div class="glass">
    <h2>全部用户列表</h2>
    <div id="userListWrap"></div>
  </div>
</div>
<script>
(async function checkAuthRedirect() {
  const res = await fetch('/api/user?action=check');
  const data = await res.json();
  if (!data.login) {
    const currentUrl = location.href;
    location.href = `/login.html?redirect=${encodeURIComponent(currentUrl)}`;
    return;
  }
})();
async function checkAuth(){
  const res = await fetch('/api/user?action=check');
  const data = await res.json();
  if(!data.login || data.role === 'guest' || data.role === 'banned'){
    location.href = `/error.html?code=403&msg=对不起，你没有权限`;
    return;
  }
  loadUserList();
}

async function adminCreateUser(){
  const username = document.getElementById('newUser').value.trim();
  const pwd = document.getElementById('newPwd').value.trim();
  const role = document.getElementById('newRole').value;
  if(!username||!pwd) return alert('用户名密码不能为空');
  const res = await fetch('/api/user?action=adminAddUser',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username,password:pwd,role})
  })
  const ret = await res.json();
  alert(ret.msg);
  loadUserList();
}

async function loadUserList(){
  const res = await fetch('/api/user?action=userList');
  const data = await res.json();
  if(data.code !== 0) return alert(data.msg);
  const loginRes = await fetch('/api/user?action=check');
  const loginInfo = await loginRes.json();
  const myRole = loginInfo.role;
  const myUid = loginInfo.uid;

  const wrap = document.getElementById('userListWrap');
  wrap.innerHTML = data.list.map(u=>{
    let optionHtml = '';
    // owner 只能所有者自己修改，admin看不到owner选项
    if(myRole === 'owner'){
      optionHtml = `
        <option value="admin">管理员 admin</option>
        <option value="writer">作家 writer</option>
        <option value="guest">访客 guest</option>
        <option value="banned">封禁 banned</option>
      `;
    }else{
      // admin 无owner选项，且不能修改其他admin
      if(u.role === 'owner' || u.role === 'admin'){
        optionHtml = `<option value="${u.role}">${u.role}（不可修改）</option>`;
      }else{
        optionHtml = `
          <option value="guest">访客 guest</option>
          <option value="writer">作家 writer</option>
          <option value="banned">封禁 banned</option>
        `;
      }
    }
    let delBtnShow = true;
    // admin不能删owner、其他admin
    if(myRole === 'admin' && (u.role === 'owner' || u.role === 'admin')){
      delBtnShow = false;
    }
    return `
  <div style="margin:10px 0;padding:10px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;gap:15px;flex-wrap:wrap">
    <span>ID:${u.id} | 用户名:${escapeHtml(u.username)} | 角色:${u.role} | ${u.is_cancel==1?'【已注销】':'正常账号'}</span>
    <select id="role_${u.id}" ${(myRole === 'admin' && (u.role === 'owner' || u.role === 'admin')) ? 'disabled' : ''}>
      ${optionHtml}
    </select>
    <button class="glass-btn" onclick="saveRole(${u.id})" ${(myRole === 'admin' && (u.role === 'owner' || u.role === 'admin')) ? 'disabled' : ''}>保存修改</button>
    ${delBtnShow ? `<button class="glass-btn" style="background:rgba(255,80,80,0.25)" onclick="delUser(${u.id},'${escapeHtml(u.username)}')">删除用户</button>` : '<span style="color:#aaa">不可删除</span>'}
  </div>
  `
  }).join('');
  data.list.forEach(u=>{
    const sel = document.getElementById(`role_${u.id}`);
    if(sel) sel.value = u.role;
  })
}

async function saveRole(uid){
  const newRole = document.getElementById(`role_${uid}`).value;
  const res = await fetch('/api/user?action=setRole',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({targetUid:uid,newRole})
  })
  const ret = await res.json();
  alert(ret.msg);
  loadUserList();
}

async function delUser(uid, uname){
  if(!confirm(`确定删除用户【${uname}】？该用户所有文章保留，作者显示账户已注销，不可恢复！`)) return;
  const res = await fetch('/api/user?action=deleteUser',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({targetUid:uid})
  });
  const ret = await res.json();
  alert(ret.msg);
  loadUserList();
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
checkAuth();
</script>
</body>
</html>
