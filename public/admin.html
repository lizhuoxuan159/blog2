<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员用户管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="/index.html"><button class="glass-btn">返回首页</button></a>
        </nav>
        <div class="glass" style="margin-bottom:20px">
            <h3>手动创建新用户</h3>
            <input type="text" id="newUser" placeholder="用户名">
            <input type="password" id="newPwd" placeholder="初始密码">
            <select id="newRole">
                <option value="guest">访客 guest</option>
                <option value="writer">作家 writer</option>
                <option value="banned">封禁 banned</option>
            </select>
            <button class="glass-btn" onclick="adminCreateUser()">创建用户</button>
        </div>
        <div class="glass">
            <h2>全部用户列表</h2>
            <div id="userListWrap"></div>
        </div>
    </div>
    <script>
        let myRole = "";
        let myUid = null;

        // 登录校验
        async function checkAuth() {
            const res = await fetch('/api/user/check');
            const data = await res.json();
            if (!data.data.login) {
                const currentUrl = location.href;
                location.href = `/login.html?redirect=${encodeURIComponent(currentUrl)}`;
                return;
            }
            myRole = data.data.role;
            myUid = data.data.uid;
            if (myRole === 'guest' || myRole === 'banned') {
                location.href = `/error.html?code=403&msg=对不起，你没有权限`;
                return;
            }
            loadUserList();
        }

        async function adminCreateUser() {
            const username = document.getElementById('newUser').value.trim();
            const pwd = document.getElementById('newPwd').value.trim();
            const role = document.getElementById('newRole').value;
            if (!username || !pwd) return alert('用户名密码不能为空');
            const res = await fetch('/api/user/admin/addUser', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password: pwd, role })
            })
            const ret = await res.json();
            alert(ret.msg);
            loadUserList();
        }

        async function loadUserList() {
            const res = await fetch('/api/user/admin/list');
            const data = await res.json();
            if (data.code !== 0) {
                alert(data.msg);
                return;
            }
            const list = data.data;
            const wrap = document.getElementById('userListWrap');
            wrap.innerHTML = '';
            list.forEach(u => {
                let optionHtml = '';
                if (myRole === 'owner') {
                    optionHtml = `
            <option value="owner" ${u.role === 'owner' ? 'selected' : ''}>站主 owner</option>
            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>管理员 admin</option>
            <option value="writer" ${u.role === 'writer' ? 'selected' : ''}>作家 writer</option>
            <option value="guest" ${u.role === 'guest' ? 'selected' : ''}>访客 guest</option>
            <option value="banned" ${u.role === 'banned' ? 'selected' : ''}>封禁 banned</option>
          `;
                } else {
                    if (u.role === 'owner' || u.role === 'admin') {
                        optionHtml = `<option value="${u.role}" selected>${u.role}（不可修改）</option>`;
                    } else {
                        optionHtml = `
              <option value="guest" ${u.role === 'guest' ? 'selected' : ''}>访客 guest</option>
              <option value="writer" ${u.role === 'writer' ? 'selected' : ''}>作家 writer</option>
              <option value="banned" ${u.role === 'banned' ? 'selected' : ''}>封禁 banned</option>
            `;
                    }
                }
                let delDisabled = false;
                if (myRole === 'admin' && (u.role === 'admin' || u.role === 'owner')) {
                    delDisabled = true;
                }
                let banInfo = u.ban_until ? `封禁至:${u.ban_until}` : '';
                let cancelInfo = u.is_cancel === 1 ? "【已注销】" : "";
                wrap.innerHTML += `
        <div style="margin:10px 0;padding:10px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;gap:15px;flex-wrap:wrap">
          <span>ID:${u.id} | 用户名:${escapeHtml(u.username)} | 角色:${u.role} ${banInfo} ${cancelInfo}</span>
          <select id="role_${u.id}" ${(myRole === 'admin' && (u.role === 'owner' || u.role === 'admin')) ? 'disabled' : ''}>
            ${optionHtml}
          </select>
          <button class="glass-btn" onclick="saveRole(${u.id})" ${(myRole === 'admin' && (u.role === 'owner' || u.role === 'admin')) ? 'disabled' : ''}>保存修改</button>
          <button class="glass-btn" onclick="banUser(${u.id})">设置封禁天数</button>
          <button class="glass-btn" style="background:rgba(255,80,80,0.25)" onclick="delUser(${u.id},'${escapeHtml(u.username)}')" ${delDisabled ? 'disabled' : ''}>删除用户</button>
        </div>
        `
            })
        }

        async function saveRole(uid) {
            const newRole = document.getElementById(`role_${uid}`).value;
            const res = await fetch('/api/user/admin/setRole', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targetUid: uid, newRole })
            })
            const ret = await res.json();
            alert(ret.msg);
            loadUserList();
        }

        async function banUser(targetUid) {
            const days = prompt("请输入封禁天数：");
            if (!days || isNaN(Number(days)) || Number(days) <= 0) return;
            const res = await fetch('/api/user/admin/ban', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ targetUid: targetUid, banDays: Number(days) })
            })
            const ret = await res.json();
            alert(ret.msg);
            loadUserList();
        }

        async function delUser(uid, uname) {
            if (!confirm(`确定删除用户【${uname}】？文章保留，不可恢复！`)) return;
            const res = await fetch('/api/user/admin/deleteUser', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targetUid: uid })
            })
            const ret = await res.json();
            alert(ret.msg);
            loadUserList();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        checkAuth();
    </script>
</body>
</html>
