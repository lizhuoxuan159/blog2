<script>
/**
 * 注意：当前后端仅实现2个管理员接口：
 * 1. GET /api/user/admin/list 获取全部用户列表
 * 2. POST /api/user/admin/ban 封禁用户
 * 后端缺失：检查登录、新建用户、修改角色、删除用户接口，后续后端补充接口之后再启用对应函数
*/

// 加载用户列表
async function loadUserList(){
  try {
    const res = await fetch('/api/user/admin/list');
    const data = await res.json();
    if(data.code !== 0){
      alert(data.msg);
      // 无权限跳转403页面
      location.href = `/error.html?code=403&msg=对不起，你没有权限`;
      return;
    }
    const userList = data.data;
    const wrap = document.getElementById('userListWrap');
    wrap.innerHTML = '';
    userList.forEach(u=>{
      let optionHtml = '';
      // 后续你后端补充修改角色接口之后启用
      optionHtml = `<option value="${u.role}">${u.role}</option>`;
      let banText = u.ban_until ? `封禁至:${u.ban_until}` : "正常";
      let cancelText = u.is_cancel ===1 ? "【账户已注销】" : "";
      wrap.innerHTML += `
        <div style="margin:10px 0;padding:10px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;gap:15px;flex-wrap:wrap">
          <span>ID:${u.id} | 用户名:${escapeHtml(u.username)} | 角色:${u.role} | ${banText} ${cancelText}</span>
          <button class="glass-btn" onclick="banUser(${u.id})" style="background:rgba(10,120,200,0.2)">设置封禁天数</button>
        </div>
      `;
    })
  } catch(err){
    console.error(err);
    alert("获取用户列表失败");
  }
}

// 封禁用户（对接后端现有的 /api/user/admin/ban）
async function banUser(targetUid){
  const days = prompt("请输入封禁天数（数字）：");
  if(!days || isNaN(Number(days)) || Number(days) <= 0) return alert("天数填写错误");
  const res = await fetch('/api/user/admin/ban',{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({targetUid:targetUid, banDays:Number(days)})
  })
  const ret = await res.json();
  alert(ret.msg);
  loadUserList();
}

function escapeHtml(str){
  if(!str) return "";
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 页面入口
(async function initPage(){
  await loadUserList();
})();
</script>
