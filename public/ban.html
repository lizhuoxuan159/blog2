<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>放逐投票</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.ico">
</head>
<body>
    <div class="container">
        <nav><a href="/index.html"><button>首页</button></a></nav>
        <div class="glass">
            <h2>用户放逐投票</h2>
            <div id="voteList"></div>
        </div>
    </div>
    <script>
        async function loadVotes() {
            const res = await fetch('/api/ban?action=list');
            const data = await res.json();
            const wrap = document.getElementById('voteList');
            wrap.innerHTML = '';
            data.forEach(item => {
                wrap.innerHTML += `
        <div style="margin:10px;padding:10px;border:1px solid #444">
          <h4>目标用户：${item.targetUserName}</h4>
          <p>理由：${item.reason}</p>
          <p>支持：${item.yesCount} 反对：${item.noCount}</p>
          <p>状态：${item.status}</p>
          ${item.status === 'active' && !item.myVote ? `
            <button onclick="vote(${item.id},'yes')">支持放逐</button>
            <button onclick="vote(${item.id},'no')">反对</button>
          ` : ''}
        </div>
        `
            })
        }
        async function vote(voteId, type) {
            const res = await fetch('/api/ban?action=vote', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ voteId, voteType: type })
            })
            const d = await res.json();
            alert(d.msg);
            loadVotes();
        }
        loadVotes();
    </script>
</body>
</html>
