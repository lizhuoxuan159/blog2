<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>放逐投票</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.ico">
</head>
<body>
    <div class="container">
        <nav><a href="/index.html"><button>首页</button></a></nav>
        <div class="glass">
            <h2>用户放逐投票</h2>
            <div id="voteList"></div>
        </div>
    </div>
    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        async function loadVotes() {
            try {
                const res = await fetch('/api/ban?action=list');
                const data = await res.json();
                const wrap = document.getElementById('voteList');
                wrap.innerHTML = '';
                if (!Array.isArray(data)) return;
                data.forEach(item => {
                    wrap.innerHTML += `
        <div style="margin:10px;padding:10px;border:1px solid #444">
          <h4>目标用户：${escapeHtml(item.targetUserName)}</h4>
          <p>理由：${escapeHtml(item.reason)}</p>
          <p>支持：${escapeHtml(item.yesCount)} 反对：${escapeHtml(item.noCount)}</p>
          <p>状态：${escapeHtml(item.status)}</p>
          ${item.status === 'active' && !item.myVote ? `
            <button onclick="vote(${item.id},'yes')">支持放逐</button>
            <button onclick="vote(${item.id},'no')">反对</button>
          ` : ''}
        </div>
        `
                })
            } catch (e) {
                console.error('加载投票列表失败', e);
            }
        }
        async function vote(voteId, type) {
            const res = await fetch('/api/ban?action=vote', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ voteId, voteType: type })
            })
            const d = await res.json();
            alert(d.msg);
            loadVotes();
        }
        loadVotes();
    </script>
</body>
</html>
