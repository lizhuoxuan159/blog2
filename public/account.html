<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="/index.html"><button class="glass-btn">返回首页</button></a>
            <a href="javascript:logout()"><button class="glass-btn" style="background:rgba(220,60,60,0.2)">退出登录</button></a>
    </div>
    <div class="glass" id="userInfoBox">
        <h2>个人信息</h2>
        <p>用户名：<span id="showUsername"></span></p>
        <p>角色：<span id="showRole"></span></p>
        <p>微软绑定状态：<span id="msBindTip"></span> <button id="unbindMsBtn" style="display:none" onclick="unbindMicrosoft()">解绑微软账号</button></p>
    </div>

    <div class="glass" style="margin-top:20px">
        <h3>修改登录密码</h3>
        <input type="password" id="oldPwd" placeholder="原密码">
        <input type="password" id="newPwd" placeholder="新密码">
        <button class="glass-btn" onclick="changePassword()">确认修改</button>
    </div>
    </div>

    <script>
        let loginData = null;
        // 页面加载校验登录状态
        (async function init() {
            const res = await fetch('/api/user/check');
            const data = await res.json();
            if (!data.data?.login) {
                const currentUrl = location.href;
                location.href = `/login.html?redirect=${encodeURIComponent(currentUrl)}`;
                return;
            }
            loginData = data.data;
            document.getElementById('showUsername').innerText = loginData.username;
            document.getElementById('showRole').innerText = loginData.role;
            // 判断是否绑定微软账号
            if (loginData.microsoft_id) {
                document.getElementById('msBindTip').innerText = "已绑定";
                document.getElementById('unbindMsBtn').style.display = "inline-block";
            } else {
                document.getElementById('msBindTip').innerText = "未绑定";
            }
        })();

        // 修改密码
        async function changePassword() {
            const oldPwd = document.getElementById('oldPwd').value.trim();
            const newPwd = document.getElementById('newPwd').value.trim();
            if (!oldPwd || !newPwd) return alert("请填写完整新旧密码");
            const btn = event.target;
            btn.disabled = true;
            try {
                const res = await fetch('/api/user/change-pwd', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ oldPwd, newPwd })
                })
                const ret = await res.json();
                alert(ret.msg);
                // 修改成功跳转登出
                if (ret.code === 0) {
                    location.href = "/api/user/logout";
                }
            } catch (err) {
                alert("请求异常，稍后重试");
                console.error(err);
            }
            btn.disabled = false;
        }

        // 解绑微软账号
        async function unbindMicrosoft() {
            if (!confirm("确定解绑Microsoft登录账号？解绑后只能用户名密码登录")) return;
            const res = await fetch('/api/user/admin/unbindMs', {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            })
            const ret = await res.json();
            alert(ret.msg);
            location.reload();
        }

        // 退出登录
        function logout() {
            location.href = "/api/user/logout";
        }
    </script>
</body>
