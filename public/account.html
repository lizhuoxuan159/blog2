<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <nav>
    <a href="/index.html"><button class="glass-btn">返回首页</button></a>
  </nav>
  <div class="glass" style="max-width:500px;margin:0 auto">
    <h2>个人设置</h2>
    <hr>

    <h3>GitHub 账号绑定</h3>
    <p style="opacity:0.8">绑定后可直接使用GitHub快捷登录</p>
    <div id="githubBindArea">
      <a id="bindBtnWrap" href="/api/user?action=githubBind">
        <button class="glass-btn" style="background:rgba(40,140,255,0.2)">绑定 GitHub 账号</button>
      </a>
      <div id="bindInfoWrap" style="display:none;margin-top:12px;">
        <p>已绑定 GitHub ID：<span id="githubName" style="font-weight:bold;color:#408cff"></span></p>
        <button class="glass-btn" style="background:rgba(255,100,100,0.2);margin-top:8px" onclick="unbindGithub()">解绑GitHub</button>
      </div>
    </div>

    <hr style="margin:25px 0">
    <!-- 新增微软绑定区域 -->
    <h3>Microsoft 账号绑定</h3>
    <p style="opacity:0.8">绑定后可直接使用微软/Outlook账号快捷登录</p>
    <div id="microsoftBindArea">
      <a id="msBindBtnWrap" href="/api/user?action=microsoftBind">
        <button class="glass-btn" style="background:rgba(0,120,212,0.2)">绑定 Microsoft 账号</button>
      </a>
      <div id="msBindInfoWrap" style="display:none;margin-top:12px;">
        <p>已绑定 Microsoft ID：<span id="msName" style="font-weight:bold;color:#0078d4"></span></p>
        <button class="glass-btn" style="background:rgba(255,100,100,0.2);margin-top:8px" onclick="unbindMicrosoft()">解绑Microsoft</button>
      </div>
    </div>

    <hr style="margin:25px 0">
    <h3>修改密码</h3>
    <input type="password" id="oldPwd" placeholder="当前密码">
    <input type="password" id="newPwd" placeholder="新密码">
    <button class="glass-btn" onclick="changePassword()">确认修改密码</button>
    <hr style="margin:25px 0">
    <h3>注销当前账户</h3>
    <p style="opacity:0.8">注销后账号无法登录，过往文章作者会显示「账户已注销」，操作不可逆</p>
    <input type="password" id="cancelPwd" placeholder="输入密码确认注销">
    <button class="glass-btn" style="background:rgba(255,70,70,0.2)" onclick="cancelMyAccount()">永久注销账号</button>
  </div>
</div>
<script>
let userData = null;

(async function checkAuthRedirect() {
  const res = await fetch('/api/user?action=check');
  const data = await res.json();
  userData = data;
  if (!data.login) {
    const currentUrl = location.href;
    location.href = `/login.html?redirect=${encodeURIComponent(currentUrl)}`;
    return;
  }
  renderGithubBind();
  renderMicrosoftBind(); // 新增渲染微软绑定状态
})();

function renderGithubBind() {
  const bindBtnWrap = document.getElementById('bindBtnWrap');
  const bindInfoWrap = document.getElementById('bindInfoWrap');
  const nameText = document.getElementById('githubName');
  if (userData.github_id && userData.github_id !== null) {
    bindBtnWrap.style.display = 'none';
    bindInfoWrap.style.display = 'block';
    nameText.innerText = userData.github_id;
  } else {
    bindBtnWrap.style.display = 'block';
    bindInfoWrap.style.display = 'none';
  }
}

// 微软绑定状态渲染函数
function renderMicrosoftBind() {
  const msBindBtnWrap = document.getElementById('msBindBtnWrap');
  const msBindInfoWrap = document.getElementById('msBindInfoWrap');
  const msNameText = document.getElementById('msName');
  if (userData.microsoft_id && userData.microsoft_id !== null) {
    msBindBtnWrap.style.display = 'none';
    msBindInfoWrap.style.display = 'block';
    msNameText.innerText = userData.microsoft_id;
  } else {
    msBindBtnWrap.style.display = 'block';
    msBindInfoWrap.style.display = 'none';
  }
}

async function unbindGithub() {
  if (!confirm('确认解绑当前GitHub账号？解绑后无法再用该GitHub登录本站')) return;
  const res = await fetch('/api/user?action=unbindGithub', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' }
  });
  const ret = await res.json();
  alert(ret.msg);
  if (ret.code === 0) location.reload();
}

// 微软解绑接口函数
async function unbindMicrosoft() {
  if (!confirm('确认解绑当前Microsoft账号？解绑后无法再用该微软账号登录本站')) return;
  const res = await fetch('/api/user?action=unbindMicrosoft', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' }
  });
  const ret = await res.json();
  alert(ret.msg);
  if (ret.code === 0) location.reload();
}

async function changePassword(){
  const old = document.getElementById('oldPwd').value.trim();
  const newP = document.getElementById('newPwd').value.trim();
  if(!old||!newP) return alert('密码不能为空');
  const res = await fetch('/api/user?action=changePwd',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({oldPwd:old,newPwd:newP})
  })
  const ret = await res.json();
  alert(ret.msg);
  if(ret.code===0) location.href='/login.html';
}

async function cancelMyAccount(){
  const pwd = document.getElementById('cancelPwd').value.trim();
  if(!pwd) return alert('请输入密码');
  if(!confirm('确认永久注销账号？该操作不可撤回！')) return;
  const res = await fetch('/api/user?action=cancelAccount',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pwd})
  })
  const ret = await res.json();
  alert(ret.msg);
  location.href='/index.html';
}
</script>
</body>
</html>
