<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私信 - 犇犇广场</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
      height: 100vh;
      overflow: hidden;
    }

    /* 顶部导航 */
    .navbar {
      background: #3498db;
      color: white;
      padding: 12px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .navbar-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar h1 {
      font-size: 18px;
      font-weight: 600;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
    }
    .navbar a:hover { opacity: 1; }

    /* 主容器 */
    .main-container {
      max-width: 1000px;
      margin: 0 auto;
      height: calc(100vh - 56px);
      display: flex;
      background: white;
    }

    /* 左侧会话列表 */
    .sidebar {
      width: 280px;
      border-right: 1px solid #e8e8e8;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      font-weight: 600;
      font-size: 15px;
      color: #2c3e50;
    }
    .conversation-list {
      flex: 1;
      overflow-y: auto;
    }
    .conversation-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f8f8f8;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s;
    }
    .conversation-item:hover {
      background: #f5f9ff;
    }
    .conversation-item.active {
      background: #e8f4fd;
    }
    .conv-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3498db, #2980b9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 16px;
      flex-shrink: 0;
    }
    .conv-info {
      flex: 1;
      min-width: 0;
    }
    .conv-name {
      font-weight: 500;
      font-size: 14px;
      color: #2c3e50;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-last-msg {
      font-size: 12px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .conv-meta {
      text-align: right;
      flex-shrink: 0;
    }
    .conv-time {
      font-size: 11px;
      color: #bbb;
    }
    .unread-badge {
      display: inline-block;
      background: #e74c3c;
      color: white;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      margin-top: 4px;
      min-width: 18px;
      text-align: center;
    }

    /* 右侧聊天窗口 */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3498db, #2980b9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }
    .chat-header .name {
      font-weight: 600;
      font-size: 15px;
      color: #2c3e50;
    }

    /* 消息列表 */
    .message-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      background: #f9fafc;
    }
    .message-item {
      margin-bottom: 16px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .message-item.self {
      flex-direction: row-reverse;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 12px;
      flex-shrink: 0;
    }
    .message-item.self .msg-avatar {
      background: linear-gradient(135deg, #3498db, #2980b9);
    }
    .msg-bubble {
      max-width: 65%;
      padding: 10px 14px;
      border-radius: 12px;
      word-break: break-word;
      white-space: pre-wrap;
      font-size: 14px;
      position: relative;
    }
    .message-item:not(.self) .msg-bubble {
      background: white;
      border: 1px solid #e8e8e8;
      border-bottom-left-radius: 4px;
    }
    .message-item.self .msg-bubble {
      background: #3498db;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg-time {
      font-size: 11px;
      color: #bbb;
      margin-top: 4px;
      text-align: center;
    }

    /* 空状态 */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 14px;
    }
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* 输入框 */
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #f0f0f0;
      background: white;
    }
    .input-box {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-box textarea {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      resize: none;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      min-height: 40px;
      max-height: 120px;
    }
    .input-box textarea:focus {
      border-color: #3498db;
    }
    .send-btn {
      padding: 10px 20px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
      height: 40px;
    }
    .send-btn:hover { background: #2980b9; }
    .send-btn:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    /* 登录提示 */
    .login-tip {
      text-align: center;
      padding: 60px 20px;
      color: #7f8c8d;
    }
    .login-tip a {
      color: #3498db;
      text-decoration: none;
    }

    /* 响应式 */
    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
        display: none;
      }
      .sidebar.show { display: flex; }
      .chat-area { display: none; }
      .chat-area.show { display: flex; }
      .back-btn {
        display: inline-block !important;
      }
    }
    .back-btn {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      margin-right: 8px;
    }
  </style>
</head>
<body>

<div class="navbar">
  <div class="navbar-inner">
    <div style="display:flex;align-items:center">
      <button class="back-btn" onclick="showSidebar()">←</button>
      <h1>💬 私信</h1>
    </div>
    <a href="/chat.html">🐮 犇犇广场</a>
  </div>
</div>

<div class="main-container">
  <!-- 左侧会话列表 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">会话列表</div>
    <div class="conversation-list" id="conversationList">
      <p style="text-align:center;color:#bbb;padding:40px;font-size:13px">加载中...</p>
    </div>
  </div>

  <!-- 右侧聊天窗口 -->
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <p>选择一个会话开始聊天</p>
    </div>
    
    <div id="chatContent" style="display:none;flex-direction:column;height:100%">
      <div class="chat-header">
        <div class="avatar" id="chatAvatar">?</div>
        <div class="name" id="chatName">用户名</div>
      </div>
      <div class="message-list" id="messageList"></div>
      <div class="input-area">
        <div class="input-box">
          <textarea id="msgInput" placeholder="输入消息... (Enter发送)" maxlength="500"></textarea>
          <button class="send-btn" onclick="sendMessage()">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let currentLoginUid = null;
let currentLoginUser = null;
let currentChatUserId = null;
let currentChatUserName = null;
let lastMsgId = 0;
let refreshTimer = null;

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function checkLoginState() {
  try {
    const res = await fetch('/api/user?action=check');
    const data = await res.json();
    if (data.login) {
      currentLoginUid = data.uid;
      currentLoginUser = data;
      loadConversations();
      startRefresh();
    } else {
      document.querySelector('.main-container').innerHTML = `
        <div class="login-tip" style="width:100%">
          <h3>请先登录</h3>
          <p style="margin-top:10px"><a href="/login.html">去登录</a></p>
        </div>
      `;
    }
  } catch (e) {
    console.error('检查登录状态失败', e);
  }
}

async function loadConversations() {
  try {
    const res = await fetch('/api/chat?action=conversationList');
    const list = await res.json();
    
    const wrap = document.getElementById('conversationList');
    
    if (list.length === 0) {
      wrap.innerHTML = '<p style="text-align:center;color:#bbb;padding:40px;font-size:13px">暂无会话<br><br>去犇犇广场找人聊天吧~</p>';
      return;
    }

    wrap.innerHTML = list.map(conv => `
      <div class="conversation-item ${conv.userId === currentChatUserId ? 'active' : ''}" 
           onclick="openChat(${conv.userId}, '${escapeHtml(conv.userName)}')">
        <div class="conv-avatar">${escapeHtml(conv.userName ? conv.userName.charAt(0).toUpperCase() : '?')}</div>
        <div class="conv-info">
          <div class="conv-name">${escapeHtml(conv.userName)}</div>
          <div class="conv-last-msg">${conv.isLastFromMe ? '我: ' : ''}${escapeHtml(conv.lastMessage)}</div>
        </div>
        <div class="conv-meta">
          <div class="conv-time">${conv.lastTime ? conv.lastTime.slice(5, 16) : ''}</div>
          ${conv.unreadCount > 0 ? `<div class="unread-badge">${conv.unreadCount}</div>` : ''}
        </div>
      </div>
    `).join('');
  } catch (e) {
    console.error('加载会话列表失败', e);
    document.getElementById('conversationList').innerHTML = 
      '<p style="text-align:center;color:#e74c3c;padding:40px;font-size:13px">加载失败</p>';
  }
}

async function openChat(userId, userName) {
  currentChatUserId = userId;
  currentChatUserName = userName;
  
  // UI 切换
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('chatContent').style.display = 'flex';
  document.getElementById('chatName').textContent = userName;
  document.getElementById('chatAvatar').textContent = userName.charAt(0).toUpperCase();
  
  // 移动端：显示聊天区
  if (window.innerWidth <= 700) {
    document.getElementById('sidebar').classList.remove('show');
    document.getElementById('chatArea').classList.add('show');
  }

  // 高亮当前会话
  document.querySelectorAll('.conversation-item').forEach(item => {
    item.classList.remove('active');
  });
  event?.currentTarget?.classList.add('active');

  // 加载消息
  await loadMessages();
}

function showSidebar() {
  document.getElementById('chatArea').classList.remove('show');
  document.getElementById('sidebar').classList.add('show');
}

async function loadMessages() {
  if (!currentChatUserId) return;

  try {
    const res = await fetch(`/api/chat?action=getPrivateMessages&userId=${currentChatUserId}`);
    const messages = await res.json();
    
    const wrap = document.getElementById('messageList');
    
    if (messages.length === 0) {
      wrap.innerHTML = '<p style="text-align:center;color:#bbb;padding:40px;font-size:13px">还没有消息，来说点什么吧~</p>';
      return;
    }

    wrap.innerHTML = messages.map(msg => `
      <div class="message-item ${msg.isMe ? 'self' : ''}">
        <div class="msg-avatar">${msg.isMe ? (currentLoginUser?.username?.charAt(0).toUpperCase() || '我') : currentChatUserName.charAt(0).toUpperCase()}</div>
        <div>
          <div class="msg-bubble">${escapeHtml(msg.content)}</div>
          <div class="msg-time">${msg.createTime?.slice(11, 16) || ''}</div>
        </div>
      </div>
    `).join('');

    // 滚动到底部
    wrap.scrollTop = wrap.scrollHeight;

    // 更新最后一条消息ID
    if (messages.length > 0) {
      lastMsgId = messages[messages.length - 1].id;
    }

    // 刷新会话列表（更新未读数）
    loadConversations();
  } catch (e) {
    console.error('加载消息失败', e);
  }
}

async function sendMessage() {
  if (!currentChatUserId) return;

  const input = document.getElementById('msgInput');
  const content = input.value.trim();
  if (!content) return;

  const btn = document.querySelector('.send-btn');
  btn.disabled = true;

  try {
    const res = await fetch('/api/chat?action=sendPrivate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: currentChatUserId, content })
    });
    const ret = await res.json();
    if (ret.code === 0) {
      input.value = '';
      loadMessages();
      loadConversations();
    } else {
      alert(ret.msg);
    }
  } catch (e) {
    alert('发送失败：' + e.message);
  }

  btn.disabled = false;
  input.focus();
}

// Enter 发送
document.getElementById('msgInput')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// 自动刷新
function startRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if (currentChatUserId) {
      loadMessages();
    }
    loadConversations();
  }, 8000);
}

// 初始化
checkLoginState();
</script>

</body>
</html>
