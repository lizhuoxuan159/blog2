<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <nav>
    <a href="/index.html"><button class="glass-btn">返回首页</button></a>
  </nav>
  <div class="glass" style="max-width:420px;margin:0 auto">
    <h2>用户注册</h2>
    <input type="text" id="username" placeholder="用户名">
    <input type="password" id="password" placeholder="密码">
    <button class="glass-btn" style="width:100%" onclick="reg()">注册</button>
    <a href="/api/user?action=githubAuth">
      <button class="glass-btn" style="width:100%;margin-top:12px;background:rgba(30,30,30,0.2)">使用 GitHub 快捷登录/注册</button>
    </a>
    <p style="margin-top:12px;text-align:center">已有账号？<a href="/login.html">去登录</a></p>
  </div>
</div>

<script>
async function reg(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if(!u||!p) return alert('填写完整');
  const res = await fetch('/api/user?action=register',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:u,password:p})
  });
  const data = await res.json();
  if(data.code===0){
    alert('注册成功，请登录');
    location.href='/login.html';
  }else{
    alert(data.msg);
  }
}
</script>
</body>
</html>
