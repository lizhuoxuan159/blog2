<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/index.html"><button class="glass-btn">返回首页</button></a>
        </nav>
        <div class="glass" style="max-width:420px;margin:0 auto">
            <h2>用户注册</h2>
            <input type="text" id="username" placeholder="用户名">
            <input type="email" id="email" placeholder="邮箱">
            <div style="display:flex;gap:8px">
                <input type="text" id="emailCode" placeholder="邮箱验证码" style="flex:1">
                <button class="glass-btn" id="sendCodeBtn" onclick="sendEmailCode()">获取验证码</button>
            </div>
            <input type="password" id="password" placeholder="设置密码">

            <!-- hCaptcha 组件容器（未配置站点密钥时不渲染，自动跳过验证） -->
            <div id="hcaptchaBox"></div>

            <button class="glass-btn" style="width:100%" onclick="reg()">完成注册</button>
            <p style="text-align:center;margin-top:15px">已有账号 <a href="/login.html">去登录</a></p>
        </div>
    </div>
    <script>
        // ===== hCaptcha 配置 =====
        // 填入你的 hCaptcha 站点密钥（sitekey）后自动启用人机验证；
        // 留空则本页不渲染验证码，服务端同步降级跳过验证。
        const HCAPTCHA_SITEKEY = "";

        function getCaptchaToken() {
            if (HCAPTCHA_SITEKEY && typeof hcaptcha !== 'undefined') {
                try { return hcaptcha.getResponse() || ""; } catch (e) { return ""; }
            }
            return "";
        }
        function resetCaptcha() {
            if (HCAPTCHA_SITEKEY && typeof hcaptcha !== 'undefined') {
                try { hcaptcha.reset(); } catch (e) { /* ignore */ }
            }
        }
        // 动态渲染验证码组件
        if (HCAPTCHA_SITEKEY) {
            window.addEventListener('load', function () {
                if (typeof hcaptcha !== 'undefined') {
                    hcaptcha.render('hcaptchaBox', { sitekey: HCAPTCHA_SITEKEY });
                }
            });
        }

        let countdownTimer = null;

        async function sendEmailCode() {
            const email = document.getElementById("email").value.trim();
            const btn = document.getElementById("sendCodeBtn");
            const hCaptchaToken = getCaptchaToken();
            if (!email) return alert("填写邮箱");
            if (HCAPTCHA_SITEKEY && !hCaptchaToken) return alert("先完成人机验证");
            btn.disabled = true;
            try {
                const res = await fetch("/api/user?action=sendCode", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, type: "register", hCaptchaToken })
                });
                const data = await res.json();
                alert(data.msg);
                if (data.code === 0) {
                    let time = 60;
                    countdownTimer = setInterval(() => {
                        time--;
                        btn.innerText = time + "s";
                        if (time <= 0) {
                            clearInterval(countdownTimer);
                            btn.innerText = "获取验证码";
                            btn.disabled = false;
                        }
                    }, 1000)
                } else {
                    btn.disabled = false;
                    resetCaptcha();
                }
            } catch (err) {
                alert("请求失败");
                btn.disabled = false;
            }
        }

        async function reg() {
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const code = document.getElementById("emailCode").value.trim();
            const password = document.getElementById("password").value.trim();
            const hCaptchaToken = getCaptchaToken();
            if (!username || !email || !code || !password) return alert("请填写全部内容");
            if (HCAPTCHA_SITEKEY && !hCaptchaToken) return alert("完成人机验证");
            const res = await fetch("/api/user?action=register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, email, password, emailCode: code, hCaptchaToken })
            });
            const data = await res.json();
            if (data.code === 0) {
                alert("注册成功，请登录");
                location.href = "/login.html";
            } else {
                alert(data.msg);
                resetCaptcha();
            }
        }
    </script>
</body>
</html>
