<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- hCaptcha JS（data-cf-settings 豁免 Rocket Loader：被其接管时 api.js 能加载但 render() 静默失效，验证码不渲染） -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer data-cf-settings="rocketloader=off"></script>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/index.html"><button class="glass-btn">返回首页</button></a>
        </nav>
        <div class="glass" style="max-width:420px;margin:0 auto">
            <h2>用户注册</h2>
            <input type="text" id="username" placeholder="用户名">
            <input type="email" id="email" placeholder="邮箱">
            <div style="display:flex;gap:8px">
                <input type="text" id="emailCode" placeholder="邮箱验证码" style="flex:1">
                <button class="glass-btn" id="sendCodeBtn" onclick="sendEmailCode()">获取验证码</button>
            </div>
            <input type="password" id="password" placeholder="设置密码">

            <!-- hCaptcha 组件容器（未配置站点密钥时不渲染，自动跳过验证） -->
            <div id="hcaptchaBox"></div>

            <button class="glass-btn" style="width:100%" onclick="reg()">完成注册</button>
            <p style="text-align:center;margin-top:15px">已有账号 <a href="/login.html">去登录</a></p>
        </div>
    </div>
    <script>
        // ===== hCaptcha 配置 =====
        // 站点密钥由服务端环境变量动态提供（Cloudflare 控制台中以"密钥"类型
        // 配置的 HCAPTCHA_SITE_KEY，兼容变量名 HCAPTCHA）；
        // 未配置时不渲染验证码，服务端同步降级跳过验证。
        let HCAPTCHA_SITEKEY = "";
        const captchaReady = (async function loadCaptchaConfig() {
            try {
                const res = await fetch("/api/config");
                const j = await res.json();
                HCAPTCHA_SITEKEY = j?.data?.hcaptchaSiteKey || "";
            } catch (e) {
                console.error("人机验证配置获取失败", e);
            }
            if (HCAPTCHA_SITEKEY) {
                // 等待 hcaptcha 脚本就绪后渲染组件（load 事件 + 超时兜底）
                await new Promise(function (resolve) {
                    if (typeof hcaptcha !== "undefined") return resolve();
                    if (document.readyState === "complete") return resolve();
                    window.addEventListener("load", resolve);
                    setTimeout(resolve, 5000);
                });
                try {
                    if (typeof hcaptcha !== "undefined") {
                        hcaptcha.render("hcaptchaBox", { sitekey: HCAPTCHA_SITEKEY });
                    }
                } catch (e) {
                    console.error("hCaptcha 渲染失败", e);
                }
            }
        })();

        function getCaptchaToken() {
            if (HCAPTCHA_SITEKEY && typeof hcaptcha !== 'undefined') {
                try { return hcaptcha.getResponse() || ""; } catch (e) { return ""; }
            }
            return "";
        }
        function resetCaptcha() {
            if (HCAPTCHA_SITEKEY && typeof hcaptcha !== 'undefined') {
                try { hcaptcha.reset(); } catch (e) { /* ignore */ }
            }
        }

        let countdownTimer = null;

        async function sendEmailCode() {
            const email = document.getElementById("email").value.trim();
            const btn = document.getElementById("sendCodeBtn");
            await captchaReady;
            const hCaptchaToken = getCaptchaToken();
            if (!email) return alert("填写邮箱");
            if (HCAPTCHA_SITEKEY && !hCaptchaToken) return alert("先完成人机验证");
            btn.disabled = true;
            try {
                const res = await fetch("/api/user?action=sendCode", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, type: "register", hCaptchaToken })
                });
                const data = await res.json();
                alert(data.msg);
                if (data.code === 0) {
                    let time = 60;
                    countdownTimer = setInterval(() => {
                        time--;
                        btn.innerText = time + "s";
                        if (time <= 0) {
                            clearInterval(countdownTimer);
                            btn.innerText = "获取验证码";
                            btn.disabled = false;
                        }
                    }, 1000)
                } else {
                    btn.disabled = false;
                    resetCaptcha();
                }
            } catch (err) {
                alert("请求失败");
                btn.disabled = false;
            }
        }

        async function reg() {
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const code = document.getElementById("emailCode").value.trim();
            const password = document.getElementById("password").value.trim();
            await captchaReady;
            const hCaptchaToken = getCaptchaToken();
            if (!username || !email || !code || !password) return alert("请填写全部内容");
            if (HCAPTCHA_SITEKEY && !hCaptchaToken) return alert("完成人机验证");
            const res = await fetch("/api/user?action=register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, email, password, emailCode: code, hCaptchaToken })
            });
            const data = await res.json();
            if (data.code === 0) {
                alert("注册成功，请登录");
                location.href = "/login.html";
            } else {
                alert(data.msg);
                resetCaptcha();
            }
        }
    </script>
</body>
</html>
