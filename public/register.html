<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="container">
  <nav>
    <a href="/index.html"><button class="glass-btn">返回首页</button></a>
  </nav>
  <div class="glass" style="max-width:420px;margin:0 auto">
    <h2>用户注册</h2>
    <input type="text" id="username" placeholder="用户名">
    <input type="email" id="email" placeholder="邮箱">
    <div style="display:flex;gap:10px">
      <input type="text" id="emailCode" placeholder="邮箱验证码" style="flex:1">
      <button class="glass-btn" id="sendCodeBtn" onclick="sendEmailCode()" style="white-space:nowrap">发送验证码</button>
    </div>
    <input type="password" id="password" placeholder="密码">
    <button class="glass-btn" style="width:100%" onclick="reg()">注册</button>
    <!-- 修正GitHub跳转路由 -->
    <a href="/api/user/github">
      <button class="glass-btn" style="width:100%;margin-top:12px;background:rgba(30,30,30,0.2)">使用 GitHub 快捷登录/注册</button>
    </a>
    <p style="margin-top:12px;text-align:center">已有账号？<a href="/login.html">去登录</a></p>
  </div>
</div>
<script>
let countdown = 0;
let timer = null;

async function sendEmailCode(){
  const email = document.getElementById('email').value.trim();
  if(!email) return alert('请先输入邮箱');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return alert('邮箱格式不正确');
  
  if(countdown > 0) return;
  
  const btn = document.getElementById('sendCodeBtn');
  btn.disabled = true;
  btn.textContent = '发送中...';
  
  // 接口修正：/api/user/send-code 带上 type=register
  const res = await fetch('/api/user/send-code',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      email: email,
      type: "register"
    })
  });
  const data = await res.json();
  
  if(data.code === 0){
    alert('验证码已发送，请注意查收');
    countdown = 60;
    btn.textContent = `${countdown}秒后重发`;
    timer = setInterval(() => {
      countdown--;
      if(countdown <= 0){
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = '发送验证码';
      } else {
        btn.textContent = `${countdown}秒后重发`;
      }
    }, 1000);
  } else {
    alert(data.msg || '发送失败');
    btn.disabled = false;
    btn.textContent = '发送验证码';
  }
}

async function reg(){
  const u = document.getElementById('username').value.trim();
  const e = document.getElementById('email').value.trim();
  const c = document.getElementById('emailCode').value.trim();
  const p = document.getElementById('password').value.trim();
  if(!u||!e||!c||!p) return alert('请填写完整');
  
  // 注册接口修正 /api/user/register
  const res = await fetch('/api/user/register',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:u, email:e, code:c, password:p})
  });
  const data = await res.json();
  alert(data.msg);
  if(data.code===0) location.href='/login.html';
}
</script>
</body>
</html>
