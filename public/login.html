<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- hCaptcha JS -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/index.html"><button class="glass-btn">返回首页</button></a>
        </nav>
        <div class="glass" style="max-width:420px;margin:0 auto">
            <h2>用户登录</h2>
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <input type="text" id="totpCode" placeholder="两步验证6位验证码(未开启留空)">

            <!-- hCaptcha 组件 -->
            <div class="h-captcha" data-sitekey="你的hCaptcha站点密钥"></div>

            <button class="glass-btn" style="width:100%" onclick="doLogin()" id="loginBtn">登录</button>
            <a href="/api/user?action=githubLogin">
                <button class="glass-btn" style="width:100%;margin-top:12px;background:rgba(30,30,30,0.2)">使用 GitHub 快捷登录</button>
            </a>
            <button class="glass-btn" style="width:100%;margin-top:8px;background:rgba(0,120,212,0.2)" onclick="location.href='/api/user?action=microsoftLogin'">
                使用 Microsoft 账号登录
            </button>
            <p style="margin-top:12px;text-align:center">没有账号？<a href="/register.html">去注册</a></p>
            <p style="text-align:center"><a href="javascript:openForgetPwd()">忘记密码</a></p>
        </div>
    </div>

    <script>
        async function doLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const totpCode = document.getElementById("totpCode").value.trim();
            const loginBtn = document.getElementById("loginBtn");

            // 获取 hCaptcha 响应
            let hCaptchaToken = hcaptcha.getResponse();
            if (!username || !password) {
                alert("请填写用户名和密码");
                return;
            }
            if (!hCaptchaToken) {
                alert("请先完成人机验证");
                return;
            }
            loginBtn.disabled = true;
            loginBtn.innerText = "登录中...";
            try {
                const res = await fetch("/api/user?action=login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json; charset=utf-8"
                    },
                    body: JSON.stringify({ username, password, totpCode, hCaptchaToken })
                });
                const data = await res.json();
                if (data.code === 0) {
                    const urlParams = new URLSearchParams(window.location.search);
                    let redirectUrl = urlParams.get("redirect");
                    if (!redirectUrl) redirectUrl = "/index.html";
                    location.href = redirectUrl;
                } else if (data.data?.need2fa) {
                    alert("该账号开启两步验证，请填写6位验证码后重试");
                } else {
                    alert(data.msg);
                    hcaptcha.reset();
                }
            } catch (err) {
                alert("接口请求异常，请检查网络或者部署状态");
                console.error(err);
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "登录";
            }
        }

        // 忘记密码弹窗
        async function openForgetPwd() {
            const email = prompt("输入你的注册邮箱");
            if (!email) return;
            let hCaptchaToken = hcaptcha.getResponse();
            if (!hCaptchaToken) {
                alert("请先完成页面下方的人机验证");
                return;
            }
            const res = await fetch("/api/user?action=sendCode", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, type: "resetpwd", hCaptchaToken })
            });
            const json = await res.json();
            alert(json.msg);
            if (json.code === 0) {
                location.href = `/reset.html?email=${email}`;
            } else {
                hcaptcha.reset();
            }
        }
    </script>
</body>
</html>
