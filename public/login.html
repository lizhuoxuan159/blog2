<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- hCaptcha JS（data-cf-settings 豁免 Rocket Loader：被其接管时 api.js 能加载但 render() 静默失效，验证码不渲染） -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer data-cfasync="false"></script>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/index.html"><button class="glass-btn">返回首页</button></a>
        </nav>
        <div class="glass" style="max-width:420px;margin:0 auto">
            <h2>用户登录</h2>
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <input type="text" id="totpCode" placeholder="两步验证6位验证码(未开启留空)">

            <!-- hCaptcha 组件容器（未配置站点密钥时不渲染，自动跳过验证） -->
            <div id="hcaptchaBox"></div>

            <button class="glass-btn" style="width:100%" onclick="doLogin()" id="loginBtn">登录</button>
            <a href="/api/user?action=githubLogin">
                <button class="glass-btn" style="width:100%;margin-top:12px;background:rgba(30,30,30,0.2)">使用 GitHub 快捷登录</button>
            </a>
            <a href="/api/user?action=codeforcesLogin">
                <button class="glass-btn" style="width:100%;margin-top:8px;background:rgba(30,120,200,0.2)">使用 Codeforces 账号登录</button>
            </a>
            <p style="margin-top:12px;text-align:center">没有账号？<a href="/register.html">去注册</a></p>
            <p style="text-align:center"><a href="javascript:openForgetPwd()">忘记密码</a></p>
        </div>
    </div>

    <script data-cfasync="false">
        // ===== hCaptcha 配置 =====
        // 站点密钥由服务端环境变量动态提供（Cloudflare 控制台中以"密钥"类型
        // 配置的 HCAPTCHA_SITE_KEY，兼容变量名 HCAPTCHA）；
        // 未配置时不渲染验证码，服务端同步降级跳过验证。
        let HCAPTCHA_SITEKEY = "";
        const captchaReady = (async function loadCaptchaConfig() {
            try {
                const res = await fetch("/api/config");
                const j = await res.json();
                HCAPTCHA_SITEKEY = j?.data?.hcaptchaSiteKey || "";
            } catch (e) {
                console.error("人机验证配置获取失败", e);
            }
            if (HCAPTCHA_SITEKEY) {
                // 等待 hcaptcha 脚本就绪后渲染组件（load 事件 + 超时兜底）
                await new Promise(function (resolve) {
                    if (typeof hcaptcha !== "undefined") return resolve();
                    if (document.readyState === "complete") return resolve();
                    window.addEventListener("load", resolve);
                    setTimeout(resolve, 5000);
                });
                try {
                    if (typeof hcaptcha !== "undefined") {
                        hcaptcha.render("hcaptchaBox", { sitekey: HCAPTCHA_SITEKEY });
                    }
                } catch (e) {
                    console.error("hCaptcha 渲染失败", e);
                }
            }
        })();

        function getCaptchaToken() {
            if (HCAPTCHA_SITEKEY && typeof hcaptcha !== 'undefined') {
                try { return hcaptcha.getResponse() || ""; } catch (e) { return ""; }
            }
            return "";
        }
        function resetCaptcha() {
            if (HCAPTCHA_SITEKEY && typeof hcaptcha !== 'undefined') {
                try { hcaptcha.reset(); } catch (e) { /* ignore */ }
            }
        }

        async function doLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const totpCode = document.getElementById("totpCode").value.trim();
            const loginBtn = document.getElementById("loginBtn");

            // 等待人机验证配置加载完成，避免提交时配置未就绪
            await captchaReady;
            // 获取 hCaptcha 响应
            let hCaptchaToken = getCaptchaToken();
            if (!username || !password) {
                alert("请填写用户名和密码");
                return;
            }
            if (HCAPTCHA_SITEKEY && !hCaptchaToken) {
                alert("请先完成人机验证");
                return;
            }
            loginBtn.disabled = true;
            loginBtn.innerText = "登录中...";
            try {
                const res = await fetch("/api/user?action=login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json; charset=utf-8"
                    },
                    body: JSON.stringify({ username, password, totpCode, hCaptchaToken })
                });
                const data = await res.json();
                if (data.code === 0) {
                    const urlParams = new URLSearchParams(window.location.search);
                    let redirectUrl = urlParams.get("redirect");
                    if (!redirectUrl) redirectUrl = "/index.html";
                    location.href = redirectUrl;
                } else if (data.data?.need2fa) {
                    alert("该账号开启两步验证，请填写6位验证码后重试");
                } else {
                    alert(data.msg);
                    resetCaptcha();
                }
            } catch (err) {
                alert("接口请求异常，请检查网络或者部署状态");
                console.error(err);
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "登录";
            }
        }

        // 忘记密码弹窗
        async function openForgetPwd() {
            const email = prompt("输入你的注册邮箱");
            if (!email) return;
            await captchaReady;
            let hCaptchaToken = getCaptchaToken();
            if (HCAPTCHA_SITEKEY && !hCaptchaToken) {
                alert("请先完成页面下方的人机验证");
                return;
            }
            const res = await fetch("/api/user?action=sendCode", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, type: "resetpwd", hCaptchaToken })
            });
            const json = await res.json();
            alert(json.msg);
            if (json.code === 0) {
                location.href = `/reset.html?email=${encodeURIComponent(email)}`;
            } else {
                resetCaptcha();
            }
        }
    </script>
</body>
</html>
