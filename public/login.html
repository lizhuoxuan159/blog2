<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <nav>
    <a href="/index.html"><button class="glass-btn">返回首页</button></a>
  </nav>
  <div class="glass" style="max-width:420px;margin:0 auto">
    <h2>用户登录</h2>
    <input type="text" id="username" placeholder="用户名">
    <input type="password" id="password" placeholder="密码">
    <button class="glass-btn" style="width:100%" onclick="login()">登录</button>
    <p style="margin-top:12px;text-align:center">没有账号？<a href="/register.html">去注册</a></p>
  </div>
</div>

<script>
async function login(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if(!u||!p) return alert('填写完整');
  const res = await fetch('/api/user?action=login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:u,password:p})
  });
  const data = await res.json();
 if(data.code === 0){
  alert('登录成功');
  // 获取跳转来源地址
  const urlParams = new URLSearchParams(location.search);
  const target = urlParams.get('redirect');
  if(target){
    location.href = decodeURIComponent(target);
  }else{
    location.href = '/index.html';
  }
}
</script>
</body>
</html>
