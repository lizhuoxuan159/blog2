<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <nav>
    <a href="/index.html"><button class="glass-btn">返回首页</button></a>
  </nav>
  <div class="glass" style="max-width:420px;margin:0 auto">
    <h2>用户登录</h2>
    <input type="text" id="username" placeholder="用户名">
    <input type="password" id="password" placeholder="密码">
    <button class="glass-btn" style="width:100%" onclick="doLogin()" id="loginBtn">登录</button>

    <!-- GitHub登录按钮（修正路由） -->
    <a href="/api/user/github">
      <button class="glass-btn" style="width:100%;margin-top:12px;background:rgba(30,30,30,0.2)">使用 GitHub 快捷登录/注册</button>
    </a>
    <!-- 微软登录按钮（修正路由） -->
    <button class="glass-btn" style="width:100%;margin-top:8px;background:rgba(0,120,212,0.2)" onclick="location.href='/api/user/microsoft'">
      使用 Microsoft 账号登录/注册
    </button>
    <p style="margin-top:12px;text-align:center">没有账号？<a href="/register.html">去注册</a></p>
    <!-- 忘记密码弹窗触发 -->
    <p style="margin-top:8px;text-align:center"><a href="javascript:void(0)" onclick="openForgetPwd()">忘记密码？点击获取重置验证码</a></p>
  </div>
</div>

<script>
// 账号密码登录（接口地址修正 /api/user/login）
async function doLogin() {
  console.log('登录按钮被点击');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const loginBtn = document.getElementById('loginBtn');

  if (!username || !password) {
    alert('请填写用户名和密码');
    return;
  }
  loginBtn.disabled = true;
  loginBtn.innerText = '登录中...';

  try {
    // 修正接口路径
    const res = await fetch('/api/user/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json; charset=utf-8'
      },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();
    if (data.code === 0) {
      alert('登录成功');
      const urlParams = new URLSearchParams(location.search);
      const redirectUrl = urlParams.get('redirect');
      if (redirectUrl) {
        location.href = decodeURIComponent(redirectUrl);
      } else {
        location.href = '/index.html';
      }
    } else {
      alert(data.msg);
    }
  } catch (err) {
    alert('接口请求异常，请检查网络或部署状态');
    console.error('登录报错详情：', err);
  } finally {
    loginBtn.disabled = false;
    loginBtn.innerText = '登录';
  }
}

// 忘记密码：发送重置验证码 接口 /api/user/send-code type=resetpwd
async function openForgetPwd() {
  const email = prompt('请输入你的注册邮箱，系统将发送密码重置验证码：');
  if (!email || email.trim() === '') return;
  const targetEmail = email.trim();
  try {
    const res = await fetch('/api/user/send-code', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json; charset=utf-8'
      },
      body: JSON.stringify({ 
        email: targetEmail,
        type: "resetpwd"
      })
    });
    const data = await res.json();
    alert(data.msg);
    // 发送成功后跳转重置页面（自行新建reset.html）
    if(data.code === 0){
      location.href = "/reset.html?email="+encodeURIComponent(targetEmail);
    }
  } catch (err) {
    alert('请求失败，请稍后重试');
    console.error(err);
  }
}
</script>
</body>
</html>
