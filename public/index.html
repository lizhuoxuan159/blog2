<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lizhuoxuan159的博客</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <nav id="nav">
    <a href="/index.html"><button class="glass-btn">首页</button></a>
    <a href="/write.html"><button class="glass-btn">写文章</button></a>
    <a href="/login.html"><button class="glass-btn">登录</button></a>
    <a href="/register.html"><button class="glass-btn">注册</button></a>
  </nav>

  <div class="glass">
    <h1 style="margin-bottom:20px">📖 最新文章</h1>
    <div id="postList"></div>
  </div>
</div>

<script>
let isLogin = false;
let currentUser = null;

// 全局校验登录状态
async function checkLogin() {
  const res = await fetch('/api/user?action=check');
  const data = await res.json();
  isLogin = data.login;
  currentUser = data;
  renderNav();
}

// 渲染导航栏（带角色标识、管理员入口）
function renderNav() {
  const nav = document.getElementById('nav');
  if(isLogin){
    let roleText = "";
    if(currentUser.role === "admin") roleText = "【管理员】";
    else if(currentUser.role === "writer") roleText = "【作家】";
    else if(currentUser.role === "guest") roleText = "【访客】";
    nav.innerHTML = `
      <a href="/index.html"><button class="glass-btn">首页</button></a>
      <a href="/write.html"><button class="glass-btn">写文章</button></a>
      <a href="/account.html"><button class="glass-btn">个人中心</button></a>
      ${currentUser.role==='admin'?`<a href="/admin.html"><button class="glass-btn">用户管理</button></a>`:''}
      <span style="color:#fff;line-height:40px;margin:0 10px">${currentUser.username}${roleText}</span>
      <button class="glass-btn" onclick="logout()">退出登录</button>
    `;
  }else{
    nav.innerHTML = `
      <a href="/index.html"><button class="glass-btn">首页</button></a>
      <a href="/write.html"><button class="glass-btn">写文章</button></a>
      <a href="/login.html"><button class="glass-btn">登录</button></a>
      <a href="/register.html"><button class="glass-btn">注册</button></a>
    `;
  }
}

// 退出登录
async function logout(){
  await fetch('/api/user?action=logout',{method:'POST'});
  location.reload();
}

async function loadPosts(){
  const res = await fetch('/api/post?action=list');
  const posts = await res.json();
  const wrap = document.getElementById('postList');
  if(posts.length === 0){
    wrap.innerHTML = '<p>暂无文章</p>';
    return;
  }
  wrap.innerHTML = posts.map(p=>`
  <div class="glass post-item" onclick="openPost(${p.id})" style="position:relative;padding-right:80px">
    <h3>${escapeHtml(p.title)}</h3>
    <p style="opacity:0.8;margin:6px 0">作者：${escapeHtml(p.authorName)} | ${p.created_at}</p>
    <p>${escapeHtml(p.content.slice(0,80))}...</p>
    ${
      (currentUser?.role==='admin' || (currentUser?.uid === p.author_id))
      ?`<button class="glass-btn" style="position:absolute;right:15px;bottom:15px;background:rgba(255,80,80,0.25)" onclick="event.stopPropagation();delPostIndex(${p.id})">删除</button>`
      :''
    }
  </div>
`).join('');
}
function openPost(id){
  location.href = `/article.html?id=${id}`;
}
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
async function delPostIndex(pid){
  if(!confirm('确定删除该文章？不可恢复！')) return;
  const res = await fetch('/api/post?action=delete',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({postId:pid})
  });
  const ret = await res.json();
  alert(ret.msg);
  loadPosts();
}
// 初始化
checkLogin();
loadPosts();
</script>
</body>
</html>
