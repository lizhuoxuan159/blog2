<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <nav>
    <a href="/index.html"><button class="glass-btn">返回首页</button></a>
  </nav>
  <div class="glass" id="articleBox"></div>
</div>

<script>
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
async function loadDetail(){
  const id = new URLSearchParams(location.search).get('id');
  const res = await fetch(`/api/post?action=detail&id=${id}`);
  const p = await res.json();
  document.getElementById('articleBox').innerHTML = `
    <h1>${escapeHtml(p.title)}</h1>
    <p style="opacity:0.7;margin:10px 0">作者：${escapeHtml(p.username)} | ${p.created_at}</p>
    <hr>
    <p style="white-space:pre-line;line-height:1.7">${escapeHtml(p.content)}</p>
  `;
}
loadDetail();
</script>
</body>
</html>
