<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .comment-item{
      margin:12px 0;
      padding:12px;
      border:1px solid rgba(255,255,255,0.2);
      border-radius:8px;
    }
    .cm-del-btn{
      margin-left:10px;
      background:rgba(255,80,80,0.2);
    }
    .edit-modal{
      position:fixed;
      top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,0.5);
      display:flex;align-items:center;justify-content:center;
      z-index:9999;
      display:none;
    }
    .edit-box{
      background:#222;
      padding:20px;
      border-radius:10px;
      width:90%;
      max-width:500px;
    }
    .edit-box input,.edit-box textarea{
      width:100%;
      padding:8px;
      margin:6px 0;
      border-radius:6px;
      background:rgba(255,255,255,0.1);
      color:#fff;
      border:1px solid #ccc;
    }
  </style>
</head>
<body>
<div class="container">
  <div style="text-align:center;margin:20px 0">
    <a href="/index.html"><button class="glass-btn">返回首页</button></a>
    <button id="editPostBtn" class="glass-btn" style="margin-left:10px;display:none">编辑文章</button>
    <button id="delPostBtn" class="glass-btn" style="background:rgba(255,80,80,0.25);margin-left:10px;display:none" onclick="deleteArticle()">删除此文</button>
  </div>

  <div class="glass" style="max-width:600px;margin:0 auto">
    <h2 id="postTitle"></h2>
    <p id="postInfo" style="opacity:0.8;margin:8px 0"></p>
    <hr>
    <div id="postContent"></div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="edit-modal" id="editModal">
    <div class="edit-box">
      <h3>编辑文章</h3>
      <input id="editTitle" placeholder="标题">
      <textarea id="editContent" rows="8" placeholder="内容"></textarea>
      <div style="text-align:right;margin-top:10px">
        <button class="glass-btn" onclick="closeEdit()">取消</button>
        <button class="glass-btn" onclick="saveEdit()">保存</button>
      </div>
    </div>
  </div>

  <!-- 评论区域 -->
  <div class="glass" style="max-width:600px;margin:30px auto">
    <h3>评论区</h3>
    <div id="cmInputArea" style="margin:15px 0;">
      <textarea id="cmContent" style="width:100%;min-height:80px;padding:8px;border-radius:6px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;" placeholder="输入评论内容..."></textarea>
      <div style="margin-top:8px;text-align:right">
        <button class="glass-btn" onclick="submitComment()">发表评论</button>
      </div>
      <p id="cmTip" style="color:#ffaaaa;margin:5px 0;display:none"></p>
    </div>
    <div id="commentList"></div>
  </div>
</div>

<script>
let postId = new URLSearchParams(location.search).get('id');
let currentLoginUid = null;
let currentLoginRole = null;
let postAuthorId = null;
let currentTitle = '';
let currentContent = '';

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function checkLoginState(){
  const res = await fetch('/api/user?action=check');
  const data = await res.json();
  if(data.login){
    currentLoginUid = data.uid;
    currentLoginRole = data.role;
  }
  refreshCommentInputTip();
}

function refreshCommentInputTip(){
  const inputWrap = document.getElementById('cmInputArea');
  const tip = document.getElementById('cmTip');
  if(!currentLoginUid){
    inputWrap.style.display = 'none';
    tip.innerText = '登录后才可以发表评论';
    tip.style.display = 'block';
  }else if(currentLoginRole === 'banned'){
    inputWrap.style.display = 'none';
    tip.innerText = '封禁账号无法发表评论';
    tip.style.display = 'block';
  }else{
    inputWrap.style.display = 'block';
    tip.style.display = 'none';
  }
}

async function loadDetail(){
  const res = await fetch(`/api/post?action=detail&id=${postId}`);
  const data = await res.json();
  if(data?.notFound === true){
    location.href = `/error.html?code=404&msg=该文章不存在或已被删除`;
    return;
  }
  if(!data){
    location.href = `/error.html?code=404&msg=该文章不存在或已被删除`;
    return;
  }
  postAuthorId = data.author_id;
  currentTitle = data.title;
  currentContent = data.content;

  let authorName = data.displayAuthor;
  document.getElementById('postTitle').innerText = data.title;
  document.getElementById('postInfo').innerText = `作者：${authorName} | ${data.created_at}`;
  document.getElementById('postContent').innerText = data.content;

  await checkLoginState();

  const delBtn = document.getElementById('delPostBtn');
  const editBtn = document.getElementById('editPostBtn');

  // 作者或管理员显示编辑/删除
  const canManage = currentLoginRole === 'admin' || (currentLoginUid && currentLoginUid === postAuthorId);
  if(canManage){
    editBtn.style.display = 'inline-block';
    delBtn.style.display = 'inline-block';
  }

  loadCommentList();
}

// 打开编辑框
function openEdit(){
  document.getElementById('editTitle').value = currentTitle;
  document.getElementById('editContent').value = currentContent;
  document.getElementById('editModal').style.display = 'flex';
}
// 关闭编辑
function closeEdit(){
  document.getElementById('editModal').style.display = 'none';
}
// 保存编辑
async function saveEdit(){
  const title = document.getElementById('editTitle').value.trim();
  const content = document.getElementById('editContent').value.trim();
  if(!title || !content){
    alert('标题和内容不能为空');
    return;
  }
  const res = await fetch('/api/post?action=edit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ postId, title, content })
  });
  const ret = await res.json();
  alert(ret.msg);
  if(ret.code === 0){
    closeEdit();
    loadDetail();
  }
}

async function deleteArticle(){
  if(!confirm('确定删除这篇文章？删除后不可恢复！')) return;
  const res = await fetch('/api/post?action=delete',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({postId:postId})
  });
  const ret = await res.json();
  alert(ret.msg);
  location.href='/index.html';
}

async function loadCommentList(){
  const res = await fetch(`/api/post?action=getComment&postId=${postId}`);
  const cmList = await res.json();
  const wrap = document.getElementById('commentList');
  if(cmList.length === 0){
    wrap.innerHTML = '<p style="opacity:0.7">暂无评论</p>';
    return;
  }
  let html = '';
  cmList.forEach(cm=>{
    let showDelBtn = false;
    if(currentLoginRole === 'admin' || (currentLoginUid && currentLoginUid === cm.userId)){
      showDelBtn = true;
    }
    html += `
    <div class="comment-item">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span>${escapeHtml(cm.userName)} · ${cm.createTime}</span>
        ${showDelBtn ? `<button class="glass-btn cm-del-btn" onclick="delComment(${cm.id})">删除</button>` : ''}
      </div>
      <p style="margin:8px 0;white-space:pre-wrap">${escapeHtml(cm.content)}</p>
    </div>
    `
  })
  wrap.innerHTML = html;
}

async function submitComment(){
  const content = document.getElementById('cmContent').value.trim();
  if(!content){
    alert('评论内容不能为空');
    return;
  }
  const res = await fetch('/api/post?action=addComment',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({postId, content})
  })
  const ret = await res.json();
  if(ret.code === 0){
    document.getElementById('cmContent').value = '';
    loadCommentList();
  }else{
    alert(ret.msg);
  }
}

async function delComment(cmId){
  if(!confirm('确定删除这条评论？')) return;
  const res = await fetch('/api/post?action=delComment',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({commentId: cmId})
  })
  const ret = await res.json();
  alert(ret.msg);
  loadCommentList();
}

// 绑定编辑按钮
document.getElementById('editPostBtn').onclick = openEdit;

loadDetail();
</script>
</body>
</html>
