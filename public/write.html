<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>写文章</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.ico">
</head>
<body>
    <div class="container">
        <nav><a href="/index.html"><button>首页</button></a></nav>
        <div class="glass">
            <h2>撰写文章</h2>
            <input type="text" id="title" placeholder="文章标题">
            <textarea id="content" rows="15" placeholder="正文内容"></textarea>
            <div style="margin:10px 0">
                <label><input type="checkbox" id="publishSwitch"> 直接发布（取消勾选为草稿）</label>
            </div>
            <button class="glass-btn" onclick="submitArticle()">保存文章</button>
        </div>
    </div>
    <script>
        async function submitArticle() {
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const publish = document.getElementById('publishSwitch').checked ? 1 : 0;
            if (!title || !content) return alert('标题和内容不能为空');
            const btn = event.target;
            btn.disabled = true;
            try {
                const res = await fetch('/api/post?action=create', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, content, publish })
                })
                const data = await res.json();
                alert(data.msg);
                if (data.code === 0) location.href = "/index.html";
            } catch (err) {
                alert('保存失败');
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
