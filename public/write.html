<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布文章</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <nav>
    <a href="/index.html"><button class="glass-btn">返回首页</button></a>
  </nav>
  <div class="glass">
    <h2>撰写新文章</h2>
    <input type="text" id="title" placeholder="文章标题">
    <textarea id="content" rows="8" placeholder="文章内容"></textarea>
    <button class="glass-btn" onclick="publish()">发布</button>
  </div>
</div>

<script>
// 页面加载立即执行登录校验
(async function checkAuthRedirect() {
  const res = await fetch('/api/user?action=check');
  const data = await res.json();
  // 未登录 / 账号注销 / 账号封禁 → 跳转登录
  if (!data.login) {
    // 记录当前页面地址，登录成功后自动跳回来
    const currentUrl = location.href;
    location.href = `/login.html?redirect=${encodeURIComponent(currentUrl)}`;
    return;
  }
})();
let loginUid = null;

async function checkLogin() {
  const res = await fetch('/api/user?action=check');
  const data = await res.json();
  if(!data.login){
    alert('请先登录');
    location.href='/login.html';
    return;
  }
  // 访客、封禁账号禁止发文
  if(data.role === 'guest' || data.role === 'banned'){
    location.href = `/error.html?code=403&msg=对不起，你没有权限`;
    return;
  }
  loginUid = data.uid;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function publish(){
  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('content').value.trim();
  if(!title||!content) return alert('标题内容不能为空');
  const res = await fetch('/api/post?action=create',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title,content})
  });
  const data = await res.json();
  if(data.code===0){
    alert('发布成功');
    location.href='/index.html';
  }else{
    alert(data.msg);
  }
}

checkLogin();
</script>
</body>
</html>
