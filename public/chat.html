<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>公共聊天室</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.ico">
</head>
<body>
    <div class="container">
        <nav><a href="/index.html"><button>首页</button></a></nav>
        <div class="glass" id="msgBox" style="height:400px;overflow-y:auto"></div>
        <div style="display:flex;gap:5;margin-top:10px">
            <input id="msgInput" style="flex:1" placeholder="输入消息">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>
    <script>
        async function refreshMsg() {
            const res = await fetch('/api/chat?action=list');
            const data = await res.json();
            const box = document.getElementById('msgBox');
            box.innerHTML = '';
            data.forEach(m => {
                box.innerHTML += `<div><b>${m.userName}</b>：${m.content}</div>`
            })
        }
        async function sendMsg() {
            const content = document.getElementById('msgInput').value.trim();
            if (!content) return;
            const res = await fetch('/api/chat?action=send', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content })
            })
            const d = await res.json();
            if (d.code === 0) {
                document.getElementById('msgInput').value = '';
                refreshMsg();
            } else alert(d.msg);
        }
        refreshMsg();
        setInterval(refresh, 5000);
    </script>
</body>
</html>
